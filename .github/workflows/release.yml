name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker → MCP Registry → security chain (tag-based release
# detection + correct gating) lives in WYRE-AI/reusable-workflows so every *-mcp
# repo stays in lockstep instead of drifting per-repo. Caller jobs grant the
# token scopes the reusable jobs request (a reusable can only reduce, never
# expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write  # @semantic-release/github success step reads/comments on PRs
      packages: write
      id-token: write
      security-events: write
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@2b0b056bd7544937e5cbd56cf2e1ff8a180a411f
    with:
      server-name: kpn-mcp
      image-name: ghcr.io/wyre-ai/kpn-mcp
    secrets: inherit

# NO `deploy:` job — deliberate. KPN is a CONDUIT-ONLY vendor.
#
# The fleet-standard `mcp-server-deploy.yml` deploys to `gwp-<slug>` in the
# legacy `mcp-gateway-prod` resource group, not conduit. Conduit's sidecars are
# deployed from `azure/vendor-fleet.conduit-prod.bicepparam` by conduit's own
# `deploy-vendor-fleet.yml`. There is no `gwp-kpn` Container App, so a deploy
# job here could only fail. This matches connectwise-cpq-mcp, scalepad-mcp and
# clio-mcp, the other conduit-only vendors.
